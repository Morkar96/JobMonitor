name: Daily Job Monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # GEMINI_API_KEY is optional. If the repo secret isn't set, matcher.py
      # automatically falls back to keyword matching -- nothing breaks. To
      # enable LLM matching: create a free-tier key at
      # https://aistudio.google.com/apikey (confirm "Free tier", not
      # "Pay-as-you-go"), then add it as a repo secret named GEMINI_API_KEY
      # under Settings > Secrets and variables > Actions.
      - name: Run job monitor
        id: run_monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated data & reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Daily job monitor run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # Opens a GitHub Issue when new relevant jobs are found. GitHub emails
      # you automatically for new issues on your own repo (see notification
      # settings at github.com/settings/notifications) -- no SMTP/mail
      # secrets to manage, it rides on GitHub's own notification system.
      - name: Alert on new relevant jobs
        if: steps.run_monitor.outputs.compatible_count != '' && steps.run_monitor.outputs.compatible_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="${{ steps.run_monitor.outputs.compatible_count }}"
          TODAY=$(date -u +'%Y-%m-%d')
          awk "/^## ${TODAY}\$/{flag=1; next} /^## /{flag=0} flag" reports/relevant_jobs.md > /tmp/issue_body.md
          {
            echo ""
            echo "Full running log: [reports/relevant_jobs.md](https://github.com/${{ github.repository }}/blob/main/reports/relevant_jobs.md)"
          } >> /tmp/issue_body.md
          gh issue create \
            --title "Job Monitor: ${COUNT} relevant job(s) found on ${TODAY}" \
            --body-file /tmp/issue_body.md
